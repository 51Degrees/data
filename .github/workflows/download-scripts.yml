name: Download scripts

# Runs both download scripts on each operating system and checks the files
# they save. PowerShell 7, Windows PowerShell and the shell script must
# unpack the same bytes. The IP Intelligence Lite file, the largest, is only
# downloaded on Ubuntu.
on:
  pull_request:
  workflow_dispatch:

jobs:
  scripts:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Every script must unpack these to the same bytes, in this order.
      COMPARED: ip-intelligence/51Degrees-IPIV4AsnIpiV41.ipi,device-detection/20000 Evidence Records.yml
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: PowerShell downloads the files
        shell: pwsh
        run: |
          ./get-data-files.ps1 device-detection 51Degrees-IPIV4AsnIpiV41.ipi
          # The other scripts must unpack exactly these bytes.
          (Get-FileHash -LiteralPath $env:COMPARED.Split(',')).Hash |
            Set-Content "$env:RUNNER_TEMP/hashes.txt"

      - name: PowerShell downloads the IP Intelligence Lite file
        if: runner.os == 'Linux'
        shell: pwsh
        run: ./get-data-files.ps1 51Degrees-LiteV41.ipi

      - name: PowerShell keeps files that are already there
        shell: pwsh
        run: |
          $out = ./get-data-files.ps1 device-detection 6>&1 | Out-String
          if ($out -notmatch 'already there') { throw $out }

      - name: PowerShell finds nothing newer on the Distributor
        shell: pwsh
        run: |
          $out = ./get-data-files.ps1 51Degrees-LiteV4.1.hash -Update 6>&1 |
            Out-String
          if ($out -notmatch 'up to date') { throw $out }

      - name: Windows PowerShell unpacks the same files
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          ./get-data-files.ps1 51Degrees-IPIV4AsnIpiV41.ipi "20000 Evidence Records.yml" -Force
          if ($LASTEXITCODE) { exit 1 }
          $got = (Get-FileHash -LiteralPath $env:COMPARED.Split(',')).Hash -join ','
          $want = (Get-Content "$env:RUNNER_TEMP/hashes.txt") -join ','
          if ($got -ne $want) { throw "Unpacked $got, PowerShell 7 $want" }

      - name: Shell unpacks the same files and checks for newer ones
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ./get-data-files.sh -f 51Degrees-IPIV4AsnIpiV41.ipi "20000 Evidence Records.yml"
          got=$(shasum -a 256 "ip-intelligence/51Degrees-IPIV4AsnIpiV41.ipi" \
            "device-detection/20000 Evidence Records.yml" |
            cut -d ' ' -f 1 | tr a-f A-F | paste -sd , -)
          want=$(tr -d '\r' < "$RUNNER_TEMP/hashes.txt" | paste -sd , -)
          [ "$got" = "$want" ] || { echo "Unpacked $got, PowerShell 7 $want"; exit 1; }
          sh ./get-data-files.sh -u 51Degrees-IPIV4AsnIpiV41.ipi | grep 'up to date'
          sh ./get-data-files.sh device-detection | grep 'already there'

      - name: Both scripts stop a stalled download and try it again
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # A local server that sends the headers and 1 KB of a 10 MB file,
          # then nothing, and records each request's User-Agent.
          cat > "$RUNNER_TEMP/stall.py" <<'EOF'
          import http.server
          import sys
          import time

          class Stall(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  with open(sys.argv[1], 'a') as log:
                      log.write(self.headers.get('User-Agent', '') + '\n')
                  self.send_response(200)
                  self.send_header('Content-Length', str(10 * 1024 * 1024))
                  self.end_headers()
                  self.wfile.write(b'x' * 1024)
                  self.wfile.flush()
                  time.sleep(900)

              def log_message(self, *args):
                  pass

          http.server.ThreadingHTTPServer(
              ('127.0.0.1', 8765), Stall).serve_forever()
          EOF
          requests="$RUNNER_TEMP/requests.txt"
          python3 "$RUNNER_TEMP/stall.py" "$requests" &
          server=$!
          mkdir stall-test
          echo 'http://127.0.0.1:8765/stalled.bin' > stall-test/stalled.bin.link
          sleep 2
          start=$(date +%s)
          sh ./get-data-files.sh stalled.bin > "$RUNNER_TEMP/sh.txt" 2>&1 &
          sh_pid=$!
          pwsh -NoProfile -File ./get-data-files.ps1 stalled.bin \
            > "$RUNNER_TEMP/ps.txt" 2>&1 &
          ps_pid=$!
          sh_code=0; wait $sh_pid || sh_code=$?
          ps_code=0; wait $ps_pid || ps_code=$?
          seconds=$(( $(date +%s) - start ))
          kill $server
          cat "$RUNNER_TEMP/sh.txt" "$RUNNER_TEMP/ps.txt"
          echo "Both scripts finished in $seconds seconds"
          fail() { echo "::error::$1"; exit 1; }
          [ "$sh_code" -ne 0 ] || fail 'The shell script did not fail'
          [ "$ps_code" -ne 0 ] || fail 'The PowerShell script did not fail'
          for out in sh ps; do
            grep -q 'tried again (3 of 3)' "$RUNNER_TEMP/$out.txt" ||
              fail "The $out script did not try three times"
            grep -q 'was not saved' "$RUNNER_TEMP/$out.txt" ||
              fail "The $out script did not say the file was not saved"
          done
          grep -q 'Nothing arrived for 120 seconds' "$RUNNER_TEMP/ps.txt" ||
            fail 'The PowerShell script did not say why it stopped'
          [ "$(grep -c '(sh;' "$requests")" -eq 3 ] ||
            fail 'The shell script did not ask three times'
          [ "$(grep -c '(PowerShell;' "$requests")" -eq 3 ] ||
            fail 'The PowerShell script did not ask three times'
          [ "$seconds" -lt 600 ] || fail "The scripts took $seconds seconds"
          [ "$(ls stall-test)" = 'stalled.bin.link' ] ||
            fail "Files were left behind: $(ls stall-test)"
          rm -rf stall-test

      - name: Check the files
        shell: pwsh
        run: |
          $minimum = @{
            'device-detection/51Degrees-LiteV4.1.hash' = 10MB
            'device-detection/20000 Evidence Records.yml' = 1MB
            'device-detection/20000 User Agents.csv' = 1MB
            'ip-intelligence/51Degrees-IPIV4AsnIpiV41.ipi' = 1MB
          }
          if ($IsLinux) {
            $minimum['ip-intelligence/51Degrees-LiteV41.ipi'] = 100MB
          }
          foreach ($path in $minimum.Keys) {
            $file = Get-Item -LiteralPath $path
            if ($file.Length -lt $minimum[$path]) {
              throw "$path is only $($file.Length) bytes"
            }
            $stream = [System.IO.File]::OpenRead($file.FullName)
            try {
              if ($stream.ReadByte() -eq 0x1f -and $stream.ReadByte() -eq 0x8b) {
                throw "$path is still gzip-compressed"
              }
            } finally { $stream.Dispose() }
            Write-Host ('{0}: {1:N1} MB, last modified {2:u}' -f $path,
              ($file.Length / 1MB), $file.LastWriteTimeUtc)
          }
          # Every download is ignored by git, and nothing is left behind.
          $left = git status --porcelain --untracked-files=all
          if ($left) { throw "Not ignored by git: $left" }
